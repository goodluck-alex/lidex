name: lidex_network
description: Lidex hybrid wallet and crypto super app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0
  local_auth: ^2.3.0
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4
  web3dart: ^2.7.3
  bip39: ^1.0.6
  bip32: ^2.0.0
  cryptography: ^2.7.0
  http: ^1.3.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  fl_chart: ^0.70.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_svg: ^2.0.10


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/lidex_logo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/lidex_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/lidex_logo.png
    - assets/images/btc_icon.svg
    - assets/images/eth_icon.svg
    - assets/images/bnb_icon.svg
    - assets/images/ldx_icon.svg
    - assets/images/sol_icon.svg
