services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lidex
      POSTGRES_PASSWORD: lidex
      POSTGRES_DB: lidex
    ports: ["5432:5432"]
    volumes: ["lidex_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lidex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["lidex_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  lidex_postgres:
  lidex_redis:
